[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hovercraft-analysis"
version = "1.0.0"
description = "Analysis pipeline for hovercraft sensor data"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Hovercraft Analysis Team"},
]
keywords = ["hovercraft", "sensor-analysis", "data-processing", "imu", "gps"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Core scientific computing
    "numpy>=1.26.0",  # Python 3.12 support
    "scipy>=1.11.0",  # Python 3.12 support
    "pandas>=2.1.0",  # Python 3.12 support
    
    # Data formats
    "tables>=3.8.0",  # No upper bound needed for Python 3.12
    "h5py>=2.9.0",
    "pyarrow>=10.0.0,<17.0.0",  # Later versions may have compatibility issues
    
    # Visualization
    "matplotlib>=3.8.0",  # Python 3.12 support
    "seaborn>=0.13.2",
    "plotly>=5.0",
    
    # Web dashboard
    "dash>=2.0",
    "dash-bootstrap-components>=1.0",
    
    # Configuration
    "PyYAML==6.0.1",
    
    # Utilities
    "tqdm>=4.66.4",
    "pyproj>=3.5.0,<3.7",  # 3.7+ requires Python 3.10+
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.0",
    "pytest-cov>=3.0",
    
    # Code quality
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "isort>=5.10",
    
    # Development tools
    "ipython>=8.0",
    "ipdb>=0.13",
    "pre-commit>=2.20",
    
    # Documentation
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
]

notebook = [
    "jupyter>=1.0.0",
    "notebook>=6.4.0",
    "ipywidgets>=8.0",
]

[project.scripts]
hovercraft-align = "src.scripts.run_alignment:main"
hovercraft-dashboard = "src.scripts.dashboard_app:main"
hovercraft-timestamp = "src.scripts.run_timestamp_analysis:main"
hovercraft-orientation = "src.scripts.run_orientation:main"

[project.urls]
"Homepage" = "https://github.com/your-org/hovercraft-analysis"
"Bug Reports" = "https://github.com/your-org/hovercraft-analysis/issues"
"Source" = "https://github.com/your-org/hovercraft-analysis"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = [
    "**/*.yaml",
    "**/*.json",
    "**/*.md",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip_gitignore = true

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
markers = [
    "requires_data: marks tests that require experimental data files",
]
python_files = [
    "test_*.py",
    "*_test.py",
]
python_functions = [
    "test_*",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]