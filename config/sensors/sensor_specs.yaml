# Corrected sensor specifications based on timestamp analysis results
# This file reflects the actual sampling rates observed in the data

sensors:
  gps:
    expected_rate_hz: 1
    jitter_threshold_ms: 100      # GPS can have higher jitter due to 1Hz rate
    gap_threshold_factor: 2.0     # Gap = expected_interval * factor (2s for GPS)
    
  sensor_3:
    expected_rate_hz: 200         # Confirmed at 200Hz
    jitter_threshold_ms: 20       # Maximum acceptable jitter in milliseconds
    gap_threshold_factor: 10.0    # Gaps > 10x expected interval are flagged
    
  sensor_4:
    expected_rate_hz: 200         # Confirmed at 200Hz
    jitter_threshold_ms: 20
    gap_threshold_factor: 10.0
    
  sensor_5:
    expected_rate_hz: 200         # Actually runs at 200Hz, not 100Hz!
    jitter_threshold_ms: 20
    gap_threshold_factor: 10.0
    
  sensor_wb:
    expected_rate_hz: 100         # Confirmed at 100Hz
    jitter_threshold_ms: 20
    gap_threshold_factor: 10.0
    
  sensor_wnb:
    expected_rate_hz: 10          # Severely degraded - only ~7.5Hz observed
    jitter_threshold_ms: 50       # Increased threshold due to poor performance
    gap_threshold_factor: 20.0    # Many gaps observed
    notes: "This sensor appears to have timing issues - investigate hardware/configuration"

# Default configuration for unknown sensors
default:
  expected_rate_hz: 100
  jitter_threshold_ms: 20
  gap_threshold_factor: 10.0

# Analysis settings
analysis:
  # Minimum number of samples required for meaningful analysis
  min_samples: 100
  # Whether to automatically detect sampling rates if actual rate differs significantly
  auto_detect_rate: true
  # Tolerance for rate detection (actual rate must be within this % of expected)
  rate_tolerance_percent: 10

# Summary of findings:
# - GPS: Generally good, occasional jitter in some experiments
# - Sensor_3: Excellent performance at 200Hz
# - Sensor_4: Excellent performance at 200Hz  
# - Sensor_5: Running at 200Hz instead of expected 100Hz
# - Sensor_wb: Good performance at 100Hz
# - Sensor_wnb: Severe timing issues - only achieving ~7.5Hz instead of 200Hz