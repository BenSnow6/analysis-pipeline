name: RPM Estimation Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Fix NumPy/Pandas compatibility
        pip install "numpy<2.0"
        pip install -e ".[dev]"
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/rpm_estimation/ -v --cov=src.analysis.rpm --cov-report=term-missing
    
    - name: Check imports
      run: |
        python -c "from src.analysis.rpm import RPMFrame"
        python -m src.analysis.rpm.cli --help
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.9'
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella